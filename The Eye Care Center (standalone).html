document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ter-spacing:.24em; text-transform:uppercase;\n    color:var(--gold-soft); margin:0 0 24px; font-weight:500;\n  }\n  .foot-col ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:14px;}\n  .foot-col li a{font-size:14.5px; color:rgba(245,241,233,.85); transition: color .3s;}\n  .foot-col li a:hover{color:var(--gold-soft);}\n  .foot-bot{\n    padding-top:30px; border-top:1px solid rgba(245,241,233,.15);\n    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;\n    font-family:\"JetBrains Mono\", monospace; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;\n    color:rgba(245,241,233,.5);\n  }\n  .foot-bot .links{display:flex; gap:30px;}\n  .foot-bot .links a:hover{color:var(--paper);}\n\n  /* ---------- REVEAL ---------- */\n  .reveal{opacity:0; transform:translateY(28px); transition: opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1);}\n  .reveal.in{opacity:1; transform:none;}\n  .reveal.d1{transition-delay:.08s;}\n  .reveal.d2{transition-delay:.16s;}\n  .reveal.d3{transition-delay:.24s;}\n  .reveal.d4{transition-delay:.32s;}\n\n  /* ---------- RESPONSIVE ---------- */\n  @media (max-width: 1100px){\n    .nav-links{display:none;}\n    .svc-grid{grid-template-columns: repeat(2, 1fr);}\n    .doc-grid{grid-template-columns: repeat(2, 1fr); gap:28px;}\n    .portal-inner{grid-template-columns: 1fr; gap:40px;}\n    .ins-grid{grid-template-columns: 1fr 1fr; gap:24px;}\n    .ins.lead{grid-column: span 2;}\n    .loc-grid{grid-template-columns: 1fr;}\n    .foot-top{grid-template-columns: 1fr 1fr; gap:40px;}\n    .section-head{grid-template-columns: 1fr; gap:30px;}\n    .loc-head{grid-template-columns: 1fr; gap:30px;}\n    .since-inner{grid-template-columns: 1fr 1fr; gap:30px;}\n    .scroll-cue{display:none;}\n  }\n  @media (max-width: 680px){\n    .nav{padding:18px 22px;}\n    .nav.scrolled{padding:14px 22px;}\n    .nav-cta .btn:not(.gold){display:none;}\n    section{padding:90px 22px;}\n    .since{padding:30px 22px 80px;}\n    .doctors, .portal, .locations{padding-left:22px; padding-right:22px;}\n    .hero-grid{padding: 0 22px 36px;}\n    .svc-grid{grid-template-columns: 1fr;}\n    .doc-grid{grid-template-columns: 1fr;}\n    .ins-grid{grid-template-columns: 1fr;}\n    .ins.lead{grid-column: span 1;}\n    .foot-top{grid-template-columns: 1fr; gap:36px;}\n    .since-inner{grid-template-columns: 1fr;}\n    .portal-card{padding:28px;}\n    footer.foot{padding: 0 22px 30px;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============ NAV ============ -->\n<nav class=\"nav\" id=\"nav\" data-screen-label=\"Nav\">\n  <a href=\"#\" class=\"brand\">\n    <div class=\"brand-mark\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"brand-text\">\n      <span class=\"a\">The Eye Care Center<\u002Fspan>\n      <span class=\"b\">EST · FINGER LAKES · 1973<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fa>\n  <div class=\"nav-links\">\n    <a href=\"#services\">Services<\u002Fa>\n    <a href=\"#doctors\">Physicians<\u002Fa>\n    <a href=\"#portal\">Patient Portal<\u002Fa>\n    <a href=\"#insights\">Insights<\u002Fa>\n    <a href=\"#locations\">Locations<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"nav-cta\">\n    <a class=\"btn ghost\" href=\"#\"><span>Pay Bill<\u002Fspan><\u002Fa>\n    <a class=\"btn gold\" href=\"#\"><span>Book Appointment<\u002Fspan><span class=\"arr\">→<\u002Fspan><\u002Fa>\n    <button class=\"menu-btn\" aria-label=\"Menu\"><span><\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ============ HERO ============ -->\n<header class=\"hero\" data-screen-label=\"01 Hero\">\n  <div class=\"hero-media\" aria-hidden=\"true\">\n    <div class=\"ph\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-grid\">\n    <div class=\"hero-content\">\n      <div class=\"hero-tag\">\n        <span class=\"dot\"><\u002Fspan>\n        <span>Now Welcoming New Patients · 2026<\u002Fspan>\n        <span class=\"bar\"><\u002Fspan>\n        <span>Canandaigua · Geneva · Macedon<\u002Fspan>\n      <\u002Fdiv>\n      <h1>\n        <span class=\"line\"><span>Vision care,<\u002Fspan><\u002Fspan>\n        <span class=\"line\"><span>refined to a<\u002Fspan><\u002Fspan>\n        <span class=\"line\"><span><span class=\"em\">single<\u002Fspan> standard.<\u002Fspan><\u002Fspan>\n      <\u002Fh1>\n      <p class=\"hero-sub\">For more than five decades, the Finger Lakes' most thoughtful surgeons, optometrists, and aestheticians have practiced under one roof — built on clinical precision, considered design, and the quiet confidence of a regional institution.<\u002Fp>\n      <div class=\"hero-actions\">\n        <a class=\"btn gold\" href=\"#\"><span>Schedule a Consultation<\u002Fspan><span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <a class=\"btn ghost\" href=\"#services\"><span>Explore the Practice<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hero-foot\">\n      <div class=\"hero-meta\">\n        <div class=\"meta\">\n          <span class=\"k\">Established<\u002Fspan>\n          <span class=\"v\">1973<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <span class=\"k\">Specialists &amp; Staff<\u002Fspan>\n          <span class=\"v\">65<small>+ on team<\u002Fsmall><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <span class=\"k\">Locations<\u002Fspan>\n          <span class=\"v\">03<small>finger lakes<\u002Fsmall><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <span class=\"k\">Procedures / Year<\u002Fspan>\n          <span class=\"v\">12k<small>across practice<\u002Fsmall><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"scroll-cue\">\n        <span>Scroll<\u002Fspan>\n        <span class=\"line\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ SERVICES ============ -->\n<section class=\"services\" id=\"services\" data-screen-label=\"02 Services\">\n  <div class=\"container\">\n    <div class=\"section-head\">\n      <div>\n        <div class=\"num reveal\">01 — Practice<\u002Fdiv>\n        <h2 class=\"reveal d1\">A full spectrum<br>of <span class=\"em\">vision care<\u002Fspan>,<br>under one practice.<\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"reveal d2\">Four core disciplines, delivered by fellowship-trained physicians who collaborate across surgical, optometric, optical, and aesthetic care. The result is continuity — a single record, a single team, a single standard from first consult to final follow-up.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"svc-grid\">\n      <article class=\"svc reveal\">\n        <div class=\"svc-num\">01 / Surgical<\u002Fdiv>\n        <div class=\"svc-img\">\n          <div class=\"ph-mark\"><\u002Fdiv>\n          <div class=\"ph-tag\">Editorial · OR detail<\u002Fdiv>\n        <\u002Fdiv>\n        <h3>Laser Cataract <em>Surgery<\u002Fem><\u002Fh3>\n        <p>The next generation of femtosecond laser correction — performed by surgeons who pioneered the procedure regionally. Returning sharpness, depth, and clarity, often without glasses.<\u002Fp>\n        <div class=\"svc-foot\">\n          <span class=\"svc-tag\">Outpatient<\u002Fspan>\n          <a class=\"svc-link\" href=\"#\">Learn more <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"svc reveal d1\">\n        <div class=\"svc-num\">02 / Refractive<\u002Fdiv>\n        <div class=\"svc-img\">\n          <div class=\"ph-mark\"><\u002Fdiv>\n          <div class=\"ph-tag\">Editorial · LASIK suite<\u002Fdiv>\n        <\u002Fdiv>\n        <h3>LASIK &amp; <em>Refractive<\u002Fem><\u002Fh3>\n        <p>A meticulous pathway to life without correction. Wavefront-guided mapping, all-laser technique, and consultations led by surgeons — never sales staff.<\u002Fp>\n        <div class=\"svc-foot\">\n          <span class=\"svc-tag\">Same-day<\u002Fspan>\n          <a class=\"svc-link\" href=\"#\">Learn more <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"svc reveal d2\">\n        <div class=\"svc-num\">03 / Optical<\u002Fdiv>\n        <div class=\"svc-img\">\n          <div class=\"ph-mark\"><\u002Fdiv>\n          <div class=\"ph-tag\">Editorial · Frame wall<\u002Fdiv>\n        <\u002Fdiv>\n        <h3>Optical &amp; <em>Lenses<\u002Fem><\u002Fh3>\n        <p>Curated independent eyewear from a tightly edited bench of European and American makers. Precision lens craft and a styling appointment, by reservation.<\u002Fp>\n        <div class=\"svc-foot\">\n          <span class=\"svc-tag\">By appointment<\u002Fspan>\n          <a class=\"svc-link\" href=\"#\">Browse the studio <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"svc reveal d3\">\n        <div class=\"svc-num\">04 / Aesthetic<\u002Fdiv>\n        <div class=\"svc-img\">\n          <div class=\"ph-mark\"><\u002Fdiv>\n          <div class=\"ph-tag\">Editorial · Studio still<\u002Fdiv>\n        <\u002Fdiv>\n        <h3>Cosmetic <em>Treatments<\u002Fem><\u002Fh3>\n        <p>An adjacent practice in restorative aesthetics — Botox, dermal filler, Ultherapy, and the Replenish skin program — administered by clinicians with surgical precision.<\u002Fp>\n        <div class=\"svc-foot\">\n          <span class=\"svc-tag\">Replenish program<\u002Fspan>\n          <a class=\"svc-link\" href=\"#\">Learn more <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SINCE BAR ============ -->\n<section class=\"since\" aria-hidden=\"false\">\n  <div class=\"since-inner\">\n    <div>\n      <span class=\"k\">Continuously practicing<\u002Fspan>\n      <span class=\"v\">Since 1973<\u002Fspan>\n    <\u002Fdiv>\n    <div>\n      <span class=\"k\">Patients trusted to our c
