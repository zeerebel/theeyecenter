<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Eye Care Center — Version Comparison</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f0eee9; font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  iframe.preview { width:1480px; height:1000px; border:0; display:block; background:#E6ECE6; }
  /* small legend chip floating bottom-left of each artboard */
  .legend{
    position:absolute; bottom:14px; left:14px; z-index:5;
    background:#fff; border-radius:999px; padding:8px 14px;
    font-size:12px; font-weight:500;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
    display:flex; align-items:center; gap:8px;
  }
  .legend .dot{width:8px; height:8px; border-radius:50%; background:#16202E;}
  .legend.v2 .dot{background:#0E1B2C;}
  .legend.v3 .dot{background:#D6F25E; border:1px solid #aaa;}
  .legend.v4 .dot{background:#D6F25E; border:1px solid #aaa;}
  .open-btn{
    position:absolute; bottom:14px; right:14px; z-index:5;
    background:#16202E; color:#F1F0EA;
    border-radius:999px; padding:8px 16px;
    font-size:12px; font-weight:500; text-decoration:none;
    box-shadow: 0 6px 18px rgba(0,0,0,.2);
    display:inline-flex; align-items:center; gap:6px;
  }
  .open-btn:hover{ background:#000; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function Preview({ file }) {
    return (
      <div style={{position:'relative', width:'100%', height:'100%', overflow:'hidden'}}>
        <iframe className="preview" src={file} title={file} loading="lazy" />
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="eyecare-versions"
          title="The Eye Care Center — Homepage Versions"
          subtitle="Click an artboard label to focus fullscreen · drag to reorder · ESC to close"
        >
          <DCArtboard id="v1" label="v1 · Editorial Navy" width={1480} height={1000}>
            <Preview file="The Eye Care Center.html" />
          </DCArtboard>
          <DCArtboard id="v2" label="v2 · Sage Atmospheric" width={1480} height={1000}>
            <Preview file="The Eye Care Center v2.html" />
          </DCArtboard>
          <DCArtboard id="v3" label="v3 · + Discover & Eyewear" width={1480} height={1000}>
            <Preview file="The Eye Care Center v3.html" />
          </DCArtboard>
          <DCArtboard id="v4" label="v4 · Tightened · Portraits · Tweakable" width={1480} height={1000}>
            <Preview file="The Eye Care Center v4.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
